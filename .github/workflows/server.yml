name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core + LilyPond
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: system packages
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y -o DPkg::Lock::Timeout=300 --no-install-recommends ffmpeg lilypond fonts-noto-core fonts-dejavu-core
          sudo apt-get install -y --no-install-recommends fonts-vazirmatn || true
          lilypond --version | head -1
      - name: lilypond persian definitions
        run: |
          P=$(find /usr/share/lilypond -name persian.ly | head -1)
          python3 -c "import sys; t=open(sys.argv[1]).read(); e=lambda s: s.replace('%','%25').replace(chr(10),'%0A'); print('::notice title=persian.ly part1::'+e(t[:7000])); print('::notice title=persian.ly part2::'+e(t[7000:14000]))" "$P"
          F=$(find /usr/share/lilypond -name 'emmentaler-20.otf' | head -1)
          echo "::notice title=glyphs::$(strings "$F" | grep -i -E 'koron|sori|accidentals\.(flat|sharp|natural|mirrored)' | sort -u | tr '\n' ' ' | head -c 3000)"
      - run: pip install -r server/requirements.txt pytest
      - name: tests
        working-directory: server
        env: { NOTNEGAR_TEST_OUT: "${{ github.workspace }}/out" }
        run: python -m pytest -q -rA --tb=short tests 2>&1 | tee ../pytest.log; exit ${PIPESTATUS[0]}
      - name: report
        if: always()
        run: python server/tests/ci_report.py pytest.log out core
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-output, path: "out/**/job/score.*\nout/**/job/lilypond.log\nout/**/job/analysis.json", if-no-files-found: ignore }

  full:
    name: with Demucs, CREPE, Basic Pitch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: system packages
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y -o DPkg::Lock::Timeout=300 --no-install-recommends ffmpeg lilypond fonts-noto-core fonts-dejavu-core
          sudo apt-get install -y --no-install-recommends fonts-vazirmatn || true
      - name: python packages
        run: |
          pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt -r server/requirements-ml.txt pytest
          pip install "basic-pitch==0.4.0" "numpy<2" || echo "basic-pitch skipped"
      - name: capabilities
        working-directory: server
        run: |
          python -c "from notnegar.separate import demucs_available as d; from notnegar.transcribe import crepe_available as c, basic_pitch_available as b; from notnegar.lilypond import lily_available as l; print('demucs', d(), 'crepe', c(), 'basic_pitch', b(), 'lilypond', l())"
          python scripts/download_models.py
      - name: tests
        working-directory: server
        env: { NOTNEGAR_TEST_OUT: "${{ github.workspace }}/out" }
        run: python -m pytest -q -rA --tb=short tests 2>&1 | tee ../pytest.log; exit ${PIPESTATUS[0]}
      - name: report
        if: always()
        run: python server/tests/ci_report.py pytest.log out full
      - name: publish rendered pages for review
        if: always()
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null
          mkdir -p review
          for f in out/*/job/score.pdf; do [ -f "$f" ] && pdftoppm -r 70 -png -l 3 "$f" "review/$(basename $(dirname $(dirname $f)))"; done
          for f in out/*/job/score.ly; do cp "$f" "review/$(basename $(dirname $(dirname $f))).ly"; done 2>/dev/null || true
          cp out/*/job/lilypond.log review/ 2>/dev/null || true
          cd review && git init -q && git checkout -q -b ci-output && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: full-output, path: "out/**/job/score.*\nout/**/job/lilypond.log\nout/**/job/analysis.json", if-no-files-found: ignore }

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build
        working-directory: server
        run: docker build -t notnegar:ci .
      - name: run and process a song
        working-directory: server
        run: |
          cp .env.example .env
          docker run -d --name nn -p 8000:8000 --env-file .env notnegar:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done; echo
          pip install numpy scipy
          python tests/api_smoke.py http://127.0.0.1:8000 | tee ../smoke.log; rc=${PIPESTATUS[0]}
          docker logs nn 2>&1 | tail -20
          echo "::notice title=docker smoke::$(grep -E 'result:|state:|OK|FAILED' ../smoke.log | tr '\n' ' ')"
          exit $rc

  windows:
    name: Windows Server installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: install
        shell: powershell
        run: |
          Start-Transcript -Path $env:RUNNER_TEMP\install.log | Out-Null
          $failed = $false
          try { .\server\deploy\install-windows.ps1 -Source $env:GITHUB_WORKSPACE -InstallDir C:\nn }
          catch { $failed = $true; Write-Host "EXCEPTION: $($_.Exception.Message) at $($_.InvocationInfo.PositionMessage)" }
          Stop-Transcript | Out-Null
          $tail = (Get-Content $env:RUNNER_TEMP\install.log -Tail 60) -join "%0A"
          if ($failed) { Write-Host "::error title=windows install::$tail"; exit 1 }
          Write-Host "::notice title=windows install::$tail"
      - name: smoke test through the startup task
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          cd server
          C:\nn\venv\Scripts\python.exe tests\api_smoke.py http://127.0.0.1:8000 | Tee-Object -FilePath ..\smoke.log
          $rc = $LASTEXITCODE
          Get-Content C:\nn\logs\server.log -Tail 30
          $sum = (Select-String -Path ..\smoke.log -Pattern 'result:|state:|OK|FAILED|health:' | ForEach-Object { $_.Line }) -join ' '
          Write-Host "::notice title=windows smoke::$sum"
          exit $rc
